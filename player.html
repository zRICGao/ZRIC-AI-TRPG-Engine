<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投屏端 · RPG 跑团</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #040210;
            font-family: 'ZCOOL XiaoWei', 'STKaiti', 'SimSun', serif;
            color: #e8e0d0;
        }

        #app { position: fixed; inset: 0; }

        /* ══════════════ 图片层 ══════════════ */

        /* 模糊氛围底层：铺满全屏，大幅暗化模糊，填充主图侧边与下方空隙 */
        .scene-bg-blur {
            position: absolute; inset: 0; z-index: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center 30%;
            filter: blur(48px) brightness(0.26) saturate(0.55);
            transform: scale(1.07);   /* 消除 blur 边缘白边 */
        }

        /* 主图：上方区域 contain 完整展示，水平居中顶部对齐 */
        .scene-bg-img {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 1;
            width: 100%;
            height: 80vh;
            object-fit: contain;
            object-position: center top;
            transition: opacity 1.4s ease;
        }

        /* 侧边渐变模糊面板：左右各一，替代黑框 */
        .scene-side-panel {
            position: absolute;
            top: 0; height: 80vh;
            z-index: 2;
            width: 22%;
            overflow: hidden;
            pointer-events: none;
        }
        .scene-side-panel-left  { left: 0; }
        .scene-side-panel-right { right: 0; }

        .scene-side-panel img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: blur(18px) brightness(0.62) saturate(0.72);
            transform: scale(1.06);
        }
        .scene-side-panel-left {
            mask-image: linear-gradient(to right, black 25%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, black 25%, transparent 100%);
        }
        .scene-side-panel-right {
            mask-image: linear-gradient(to left, black 25%, transparent 100%);
            -webkit-mask-image: linear-gradient(to left, black 25%, transparent 100%);
        }
        .scene-side-panel-left  img { object-position: left top;  }
        .scene-side-panel-right img { object-position: right top; }

        .scene-bg-default {
            position: absolute; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse 80% 70% at 30% 40%, rgba(55,18,105,0.75) 0%, transparent 60%),
                radial-gradient(ellipse 60% 55% at 78% 60%, rgba(8,28,75,0.65) 0%, transparent 55%),
                radial-gradient(ellipse 55% 45% at 58% 95%, rgba(75,12,42,0.55) 0%, transparent 50%),
                linear-gradient(170deg, #060218 0%, #02010c 45%, #07030f 100%);
        }

        /* 底部加深遮罩：在图片底边（≈60vh）前提前淡出，使主图与暗区自然融合 */
        .screen-vignette {
            position: absolute; inset: 0; z-index: 2;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.18) 0%,
                rgba(0,0,0,0.03) 16%,
                rgba(0,0,0,0.06) 34%,
                rgba(0,0,0,0.42) 52%,
                rgba(0,0,0,0.80) 64%,
                rgba(0,0,0,0.97) 100%
            );
            pointer-events: none;
        }

        /* ══════════════ 主角状态 HUD ══════════════ */
        .pc-hud {
            position: absolute;
            top: 2.5rem; left: 2.5rem;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }

        .pc-card {
            position: relative;
            background: transparent;
            backdrop-filter: blur(1.5px);
            -webkit-backdrop-filter: blur(1.5px);
            border: 1px solid rgba(185, 150, 52, 0.28);
            border-radius: 6px;
            padding: 1rem 1.3rem 0.9rem;
            min-width: 172px;
            max-width: 208px;
            overflow: hidden;
        }

        /* 顶部鎏金流光线 */
        .pc-card::before {
            content: '';
            position: absolute;
            top: 0; left: 12%; right: 12%;
            height: 1px;
            background: linear-gradient(
                to right,
                transparent,
                rgba(218,182,82,0.7) 35%,
                rgba(255,218,105,1) 50%,
                rgba(218,182,82,0.7) 65%,
                transparent
            );
        }

        .pc-name {
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            color: #f0e098;
            text-shadow: 0 0 18px rgba(198,158,46,0.55);
            margin-bottom: 0.7rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .pc-name::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, rgba(185,150,52,0.45), transparent);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.68rem;
            letter-spacing: 0.04em;
            margin-bottom: 0.18rem;
        }

        .stat-label { color: rgba(198,162,65,0.75); }
        .stat-val   { color: #ead896; font-weight: bold; }

        .stat-bar-bg {
            height: 3px;
            background: rgba(255,255,255,0.07);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        .stat-bar-fill { height: 100%; border-radius: 2px; transition: width 0.65s ease; }
        .hp-bar  { background: linear-gradient(to right, #991b1b, #dc2626, #fca5a5); }
        .san-bar { background: linear-gradient(to right, #78350f, #d97706, #fcd34d); }

        .pc-inventory {
            font-size: 0.62rem;
            color: rgba(170,142,72,0.58);
            line-height: 1.65;
            margin-top: 0.3rem;
            padding-top: 0.4rem;
            border-top: 1px solid rgba(185,150,52,0.12);
        }

        /* ══════════════ 底部叙述区 ══════════════ */
        .bottom-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 0 4rem 2.8rem;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        /* 鎏金叙述文本框 */
        .narrative-panel {
            position: relative;
            background-color: transparent;
            /* 四角暗金 L 形花纹（角落亮、末端渐淡）*/
            background-image:
                linear-gradient(to right,  rgba(168,132,36,0.80), rgba(128,98,20,0.12)),   /* TL 横 */
                linear-gradient(to bottom, rgba(168,132,36,0.80), rgba(128,98,20,0.12)),   /* TL 竖 */
                linear-gradient(to left,   rgba(168,132,36,0.80), rgba(128,98,20,0.12)),   /* TR 横 */
                linear-gradient(to bottom, rgba(168,132,36,0.80), rgba(128,98,20,0.12)),   /* TR 竖 */
                linear-gradient(to right,  rgba(142,110,26,0.55), rgba(105,80,14,0.08)),   /* BL 横 */
                linear-gradient(to top,    rgba(142,110,26,0.55), rgba(105,80,14,0.08)),   /* BL 竖 */
                linear-gradient(to left,   rgba(142,110,26,0.55), rgba(105,80,14,0.08)),   /* BR 横 */
                linear-gradient(to top,    rgba(142,110,26,0.55), rgba(105,80,14,0.08));   /* BR 竖 */
            background-size:
                32px 1px, 1px 32px,
                32px 1px, 1px 32px,
                32px 1px, 1px 32px,
                32px 1px, 1px 32px;
            background-position:
                top left,    top left,
                top right,   top right,
                bottom left, bottom left,
                bottom right, bottom right;
            background-repeat: no-repeat;
            border-radius: 2px;
            padding: 1.3rem 2.2rem 1.5rem;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            overflow: hidden;
        }

        /* 顶部鎏金流光 */
        .narrative-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(
                to right,
                transparent 0%,
                rgba(200,162,55,0.18) 6%,
                rgba(218,182,82,0.65) 22%,
                rgba(255,218,105,1) 50%,
                rgba(218,182,82,0.65) 78%,
                rgba(200,162,55,0.18) 94%,
                transparent 100%
            );
        }

        /* 底部暗金收口线（与角纹呼应，居中渐隐） */
        .narrative-panel::after {
            content: '';
            position: absolute;
            bottom: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(148,116,28,0.42) 28%, rgba(148,116,28,0.42) 72%, transparent);
        }

        /* 场景名称标题行 */
        .narrative-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.9rem;
        }

        .deco-line-l {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, rgba(185,150,52,0.5), rgba(185,150,52,0.08));
        }

        .deco-line-r {
            flex: 1;
            height: 1px;
            background: linear-gradient(to left, rgba(185,150,52,0.5), rgba(185,150,52,0.08));
        }

        .narrative-scene-name {
            font-size: 0.82rem;
            letter-spacing: 0.28em;
            color: rgba(205,168,60,0.88);
            white-space: nowrap;
            text-shadow: 0 0 12px rgba(198,158,46,0.4);
        }

        .narrative-text {
            font-size: 1.12rem;
            line-height: 2;
            letter-spacing: 0.06em;
            color: #e2d9c0;
            text-shadow: 0 1px 6px rgba(0,0,0,0.85);
            white-space: pre-wrap;
            max-height: 28vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(185,150,52,0.3) transparent;
        }

        .narrative-text::-webkit-scrollbar { width: 3px; }
        .narrative-text::-webkit-scrollbar-track { background: transparent; }
        .narrative-text::-webkit-scrollbar-thumb {
            background: rgba(185,150,52,0.35);
            border-radius: 2px;
        }

        /* ══════════════ 选项（左右网格布局） ══════════════ */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 0.65rem;
        }

        .option-item {
            position: relative;
            background: transparent;
            border: 1px solid rgba(168, 135, 42, 0.30);
            border-radius: 3px;
            padding: 0.8rem 1.15rem;
            font-size: 0.92rem;
            letter-spacing: 0.05em;
            color: #c8b265;
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
            transition: all 0.22s ease;
            cursor: default;
            overflow: hidden;
        }

        /* 顶部流光线（hover 时激活） */
        .option-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(to right, transparent 8%, rgba(185,150,52,0.55) 50%, transparent 92%);
            opacity: 0;
            transition: opacity 0.22s;
        }

        /* 左侧金色竖线 */
        .option-item::after {
            content: '';
            position: absolute;
            top: 20%; bottom: 20%; left: 0;
            width: 2px;
            background: linear-gradient(to bottom, transparent, rgba(185,150,52,0.7) 40%, rgba(185,150,52,0.7) 60%, transparent);
            opacity: 0;
            transition: opacity 0.22s;
        }

        .option-item:hover {
            background: rgba(8, 5, 30, 0.88);
            border-color: rgba(205,168,60,0.65);
            color: #eddfa0;
            box-shadow:
                0 0 20px rgba(185,150,52,0.1),
                inset 0 1px 0 rgba(218,182,82,0.1);
        }

        .option-item:hover::before { opacity: 1; }
        .option-item:hover::after  { opacity: 1; }

        .option-num {
            color: rgba(198,162,55,0.85);
            font-weight: bold;
            margin-right: 0.55rem;
            font-size: 0.78em;
        }

        /* ══════════════ 动画 ══════════════ */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes pulseGold {
            0%, 100% { opacity: 0.12; }
            50%      { opacity: 0.22; }
        }

        .anim-fade-in-up { animation: fadeInUp 0.75s ease both; }
        .anim-fade-in    { animation: fadeIn 1.5s ease both; }
        .anim-delay-1    { animation-delay: 0.12s; }
        .anim-delay-2    { animation-delay: 0.24s; }

        /* ══════════════ 离线遮罩 ══════════════ */
        .offline-mask {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(2,1,12,0.97);
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 1.2rem;
        }

        .offline-icon {
            font-size: 1.8rem;
            color: rgba(170,55,55,0.55);
            letter-spacing: 0.2em;
        }

        .offline-title {
            font-size: 1.4rem;
            color: rgba(175,142,55,0.75);
            letter-spacing: 0.25em;
        }

        .offline-sub {
            font-size: 0.8rem;
            color: rgba(110,92,50,0.55);
            letter-spacing: 0.04em;
        }

        /* ══════════════ 等待场景 ══════════════ */
        .waiting-screen {
            position: absolute; inset: 0; z-index: 10;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 1.5rem;
        }

        .waiting-icon {
            font-size: 3.5rem;
            animation: pulseGold 3.5s ease-in-out infinite;
            filter: sepia(1) saturate(0.6);
        }

        .waiting-text {
            font-size: 1.1rem;
            color: rgba(185,150,52,0.32);
            letter-spacing: 0.4em;
        }
    </style>
</head>
<body>
<div id="app">

    <!-- ── 离线遮罩 ── -->
    <div v-if="!connected" class="offline-mask">
        <div class="offline-icon">◈</div>
        <div class="offline-title">等待 GM 引擎连接</div>
        <div class="offline-sub">正在连接 {{ API_BASE_URL }}</div>
        <div class="flex gap-2 mt-1">
            <div class="w-1.5 h-1.5 rounded-full animate-bounce"
                 style="background:rgba(175,142,55,0.4);animation-delay:0s"></div>
            <div class="w-1.5 h-1.5 rounded-full animate-bounce"
                 style="background:rgba(175,142,55,0.4);animation-delay:.2s"></div>
            <div class="w-1.5 h-1.5 rounded-full animate-bounce"
                 style="background:rgba(175,142,55,0.4);animation-delay:.4s"></div>
        </div>
        <div v-if="wsConnected === false && connectAttempts > 2" class="offline-sub mt-1">
            WebSocket 重连中（第 {{ connectAttempts }} 次）
        </div>
        <div class="offline-sub" style="max-width:400px;text-align:center;line-height:2;margin-top:.5rem">
            请确保 NEXUS 引擎已启动，通过
            <a href="http://localhost:8000/player.html"
               style="color:rgba(175,142,55,0.7);text-decoration:underline">
                http://localhost:8000/player.html
            </a>
            访问此页面
        </div>
    </div>

    <!-- ── 主界面 ── -->
    <template v-if="connected && currentScene">

        <!-- 模糊氛围底层（侧边填充 + 下方过渡区，同图源极度模糊暗化） -->
        <img v-if="sceneImage"
             :src="sceneImage"
             class="scene-bg-blur"
             alt="" />
        <!-- 主图：上方 80vh 区域，contain 完整展示 -->
        <img v-if="sceneImage"
             :src="sceneImage"
             class="scene-bg-img anim-fade-in"
             alt=""
             @error="sceneImage = null" />
        <!-- 侧边渐变模糊：左右各一面板 -->
        <div v-if="sceneImage" class="scene-side-panel scene-side-panel-left">
            <img :src="sceneImage" alt="" />
        </div>
        <div v-if="sceneImage" class="scene-side-panel scene-side-panel-right">
            <img :src="sceneImage" alt="" />
        </div>
        <div v-else class="scene-bg-default"></div>

        <!-- 渐变遮罩 -->
        <div class="screen-vignette"></div>

        <!-- 主角状态 HUD（左上角，半透明浮层） -->
        <div v-if="pcChars.length" class="pc-hud">
            <div v-for="char in pcChars" :key="char.id" class="pc-card anim-fade-in-up">
                <div class="pc-name">{{ char.name }}</div>
                <div class="stat-row">
                    <span class="stat-label">❤ HP</span>
                    <span class="stat-val">{{ char.hp }}</span>
                </div>
                <div class="stat-bar-bg">
                    <div class="stat-bar-fill hp-bar"
                         :style="{width: Math.min(100, char.hp) + '%'}"></div>
                </div>
                <div class="stat-row">
                    <span class="stat-label">✦ SAN</span>
                    <span class="stat-val">{{ char.san }}</span>
                </div>
                <div class="stat-bar-bg">
                    <div class="stat-bar-fill san-bar"
                         :style="{width: Math.min(100, char.san) + '%'}"></div>
                </div>
                <div v-if="char.inventory" class="pc-inventory">{{ char.inventory }}</div>
            </div>
        </div>

        <!-- 底部叙述区 -->
        <div class="bottom-overlay">

            <!-- 鎏金叙述文本框 -->
            <div class="narrative-panel anim-fade-in-up">
                <div class="narrative-header">
                    <div class="deco-line-l"></div>
                    <div class="narrative-scene-name">{{ currentScene.name }}</div>
                    <div class="deco-line-r"></div>
                </div>
                <div class="narrative-text">{{ currentScene.expanded_content || currentScene.content }}</div>
            </div>

            <!-- 选项：左右网格布局 -->
            <div v-if="currentScene.options && currentScene.options.filter(o => !o._trigger).length"
                 class="options-grid anim-fade-in-up anim-delay-1">
                <div v-for="(opt, i) in currentScene.options.filter(o => !o._trigger)"
                     :key="i"
                     class="option-item">
                    <span class="option-num">{{ ['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ'][i] || (i+1) }}</span>{{ opt.text }}
                </div>
            </div>

        </div>
    </template>

    <!-- ── 等待场景 ── -->
    <template v-if="connected && !currentScene">
        <div class="scene-bg-default"></div>
        <div class="waiting-screen">
            <div class="waiting-icon">⚔</div>
            <div class="waiting-text">等待 GM 选择场景</div>
        </div>
    </template>

    <!-- 背景音频（保留功能，隐藏 UI） -->
    <audio ref="audioRef" loop></audio>

</div>

<script>
const { createApp, ref, computed, onMounted, onUnmounted, watch } = Vue;

const API_BASE_URL = "http://localhost:8000";
const WS_URL = API_BASE_URL.replace(/^http/, 'ws') + "/ws/player";
const FALLBACK_POLL_INTERVAL = 5000;

createApp({
    setup() {
        const connected    = ref(false);
        const characters   = ref([]);
        const storyNodes   = ref([]);
        const currentScene = ref(null);
        const sceneImage   = ref(null);
        const scenePrompt  = ref('');
        const sceneAiText  = ref('');
        const bgmName      = ref('');
        const bgmUrl       = ref('');
        const bgmPlaying   = ref(false);
        const audioRef     = ref(null);
        const wsConnected  = ref(false);
        const connectAttempts = ref(0);

        let lastSceneId    = null;
        let lastBgmUrl     = null;
        let ws             = null;
        let reconnectTimer = null;
        let pollTimer      = null;
        let reconnectDelay = 1000;

        const pcChars  = computed(() => characters.value.filter(c => c.role === 'PC'));
        const npcChars = computed(() => characters.value.filter(c => c.role === 'NPC'));

        const applyState = (data) => {
            if (data.characters) {
                characters.value = data.characters;
            }
            const sceneId = data.current_scene_id;
            if (sceneId) {
                if (data.current_scene) {
                    const contentChanged = !currentScene.value ||
                                           currentScene.value.content !== data.current_scene.content;
                    if (lastSceneId !== sceneId || contentChanged) {
                        lastSceneId = sceneId;
                        currentScene.value = data.current_scene;
                        sceneImage.value = data.scene_image || null;
                        scenePrompt.value = data.scene_prompt || '';
                    }
                } else {
                    const found = storyNodes.value.find(n => n.id === sceneId);
                    if (found) {
                        const contentChanged = !currentScene.value ||
                                               currentScene.value.content !== found.content;
                        if (lastSceneId !== sceneId || contentChanged) {
                            lastSceneId = sceneId;
                            currentScene.value = found;
                            sceneImage.value = data.scene_image || null;
                            scenePrompt.value = data.scene_prompt || '';
                        }
                    }
                }
                sceneAiText.value = data.scene_ai_text || '';
            } else {
                currentScene.value = null;
                lastSceneId = null;
            }

            const newBgmUrl  = data.bgm_url  || '';
            const newBgmName = data.bgm_name || '';
            if (newBgmUrl !== lastBgmUrl) {
                lastBgmUrl = newBgmUrl;
                bgmUrl.value  = newBgmUrl;
                bgmName.value = newBgmName;
                if (audioRef.value) {
                    audioRef.value.src = newBgmUrl;
                    if (newBgmUrl) {
                        audioRef.value.play().then(() => { bgmPlaying.value = true; }).catch(() => {});
                    } else {
                        audioRef.value.pause();
                        bgmPlaying.value = false;
                    }
                }
            }

            connected.value = true;
        };

        const connectWs = () => {
            if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
            try {
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    wsConnected.value = true;
                    connectAttempts.value = 0;
                    reconnectDelay = 1000;
                    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'ping') return;
                        if (data.type === 'state_update') applyState(data);
                    } catch (e) {}
                };

                ws.onclose = () => {
                    wsConnected.value = false;
                    connectAttempts.value++;
                    if (!pollTimer) pollTimer = setInterval(pollFallback, FALLBACK_POLL_INTERVAL);
                    reconnectTimer = setTimeout(() => {
                        reconnectDelay = Math.min(reconnectDelay * 2, 30000);
                        connectWs();
                    }, reconnectDelay);
                };

                ws.onerror = () => {};
            } catch (e) {
                if (!pollTimer) pollTimer = setInterval(pollFallback, FALLBACK_POLL_INTERVAL);
            }
        };

        const pollFallback = async () => {
            try {
                const [stateRes, playerStateRes] = await Promise.all([
                    fetch(`${API_BASE_URL}/api/game/state`),
                    fetch(`${API_BASE_URL}/api/player/state`),
                ]);
                if (!stateRes.ok) throw new Error('state failed');
                const stateData  = await stateRes.json();
                storyNodes.value = stateData.nodes || [];
                if (playerStateRes.ok) {
                    const ps = await playerStateRes.json();
                    applyState({ ...ps, characters: stateData.characters || [] });
                }
            } catch (e) {
                connected.value = false;
            }
        };

        onMounted(() => {
            pollFallback();
            connectWs();
            if (audioRef.value) {
                audioRef.value.volume = 0.5;
                audioRef.value.addEventListener('ended',   () => { bgmPlaying.value = false; });
                audioRef.value.addEventListener('playing', () => { bgmPlaying.value = true; });
                audioRef.value.addEventListener('pause',   () => { bgmPlaying.value = false; });
            }
        });

        onUnmounted(() => {
            if (pollTimer)      clearInterval(pollTimer);
            if (reconnectTimer) clearTimeout(reconnectTimer);
            if (ws)             ws.close();
        });

        return {
            API_BASE_URL, connected, wsConnected, connectAttempts,
            currentScene, sceneImage, scenePrompt, sceneAiText,
            pcChars, npcChars, bgmName, bgmPlaying, audioRef
        };
    }
}).mount('#app');
</script>
</body>
</html>
